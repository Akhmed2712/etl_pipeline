services:
  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-postgres
    restart: always
    environment:
      POSTGRES_DB: metabase_app_db
      POSTGRES_USER: metabase_user
      # Note: Change this to a secure password in production
      POSTGRES_PASSWORD: 1234
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    networks:
      - analytics_bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase_user -d metabase_app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app_db
      MB_DB_HOST: metabase-db
      MB_DB_USER: metabase_user
      MB_DB_PASS: 1234
      MB_DB_PORT: 5432
    depends_on:
      metabase-db:
        condition: service_healthy
    networks:
      - analytics_bridge

volumes:
  metabase_db_data:

networks:
  analytics_bridge:
    driver: bridge
