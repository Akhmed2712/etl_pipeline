version: "3.8"

networks:
  analytics_bridge:
    external: true

services:
  spark-master:
    image: apache/spark:4.0.2-scala2.13-java17-ubuntu
    container_name: spark-master
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - analytics_bridge

  spark-worker-1:
    image: apache/spark:4.0.2-scala2.13-java17-ubuntu
    container_name: spark-worker-1
    restart: always
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 10g
      SPARK_WORKER_CORES: 16
    volumes:
      - ${BASE_DIR}/target/scala-2.13:/app
      - ${BASE_DIR}/catalogs:/opt/spark/work-dir/catalogs
      - ${BASE_DIR}/configs:/opt/spark/work-dir/configs
      - ${BASE_DIR}/credentials:/opt/spark/work-dir/credentials
    networks:
      - analytics_bridge