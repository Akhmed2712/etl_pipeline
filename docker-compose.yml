services:
  # DATABASE KHUSUS PREFECT
  prefect-db:
    image: postgres:16-alpine
    container_name: prefect-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: prefect_server_db
    volumes:
      - prefect_db_data:/var/lib/postgresql/data
    networks:
      - shared_network

  # PREFECT SERVER
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    entrypoint: ["prefect", "server", "start"]
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_UI_API_URL=http://127.0.0.1:4200/api
      - PREFECT_UI_STATIC_DIRECTORY=/tmp/prefect_ui
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://admin:1234@prefect-db:5432/prefect_server_db
    ports:
      - "4200:4200"
    depends_on:
      - prefect-db
    networks:
      - shared_network

  # PREFECT WORKER
  prefect-worker:
    image: prefecthq/prefect:3-latest
    build:
      context: .
      dockerfile: Dockerfile
    user: root
    container_name: prefect-worker
    restart: always
    entrypoint: ["prefect", "worker", "start", "--pool", "default-agent-pool"]
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
    volumes:
      - .:/opt/prefect/projects
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - prefect-server
    networks:
      - shared_network

volumes:
  prefect_db_data:

networks:
  shared_network:
    external: true
    name: analytics_bridge