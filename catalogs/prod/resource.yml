# ──────────────────────────────────────────────────────────────────
# Base Spark config anchor - Optimized for Jakarta Timezone
# ──────────────────────────────────────────────────────────────────
_base_conf: &base_conf
  spark.sql.session.timeZone: Asia/Jakarta
  spark.driver.extraJavaOptions: "-Duser.timezone=Asia/Jakarta"
  spark.executor.extraJavaOptions: "-Duser.timezone=Asia/Jakarta"
  spark.sql.ansi.enabled: false
  spark.sql.legacy.timeParserPolicy: LEGACY
  spark.memory.fraction: 0.8
  spark.memory.storageFraction: 0.2
  spark.driver.maxResultSize: 2g

low: &low
  <<: *base_conf
  spark.executor.cores: 1
  spark.executor.memory: 1g
  spark.executor.instances: 1

medium: &medium
  <<: *base_conf
  spark.executor.cores: 2
  spark.executor.memory: 2g
  spark.executor.instances: 2

high_local: &high_local
  <<: *base_conf
  spark.executor.cores: 4
  spark.executor.memory: 4g 
  spark.driver.memory: 2g
  spark.executor.instances: 2 

fg_agg_rekap_penggunaan_barang:
  <<: *high_local
  spark.app.name: fg_agg_rekap_penggunaan_barang
  spark.sql.shuffle.partitions: 10

fg_fact_penjualan_barang:
  <<: *high
  spark.app.name: fg_fact_penjualan_barang
  spark.sql.shuffle.partitions: 10

fg_dim_nakes:
  <<: *low
  spark.app.name: fg_dim_nakes
  spark.sql.shuffle.partitions: 10

fg_dim_pengemasan_barang:
  <<: *low
  spark.app.name: fg_dim_pengemasan_barang
  spark.sql.shuffle.partitions: 10

fg_fact_retur_barang:
  <<: *low
  spark.app.name: fg_fact_retur_barang
  spark.sql.shuffle.partitions: 10

fg_fact_pergerakan_stok:
  <<: *low
  spark.app.name: fg_fact_pergerakan_stok
  spark.sql.shuffle.partitions: 10

fg_fact_pergerakan_stok_bulanan:
  <<: *low
  spark.app.name: fg_fact_pergerakan_stok_bulanan
  spark.sql.shuffle.partitions: 10

fg_agg_abc_analysis:
  <<: *low
  spark.app.name: fg_agg_abc_analysis
  spark.sql.shuffle.partitions: 10