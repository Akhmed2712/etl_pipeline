      - column_name: fornas
        type: varchar(5)
      - column_name: kategori
        type: varchar(50)
      - column_name: jenis_kategori
        type: varchar(50)
      - column_name: satuan
        type: varchar(50)
      - column_name: hna
        type: decimal(16,2)
      - column_name: hpp
        type: decimal(16,2)
      - column_name: harga_jual
        type: decimal(16,2)
      - column_name: margin_non_resep
        type: decimal(16,2)
      - column_name: margin_resep
        type: decimal(16,2)
      - column_name: margin_resep_rajal
        type: decimal(16,2)
      - column_name: plus_ppn
        type: decimal(16,2)
    options:
      batchsize: 1000
      numPartitions: 5

fg_dim_nakes:
  <<: *mysql_conf_mart
  write_database: mart_rsia_abby
  table: fg_dim_nakes
  schema: simrs_rsia_abby
  script_type: scala
  script_location: etl_pipeline.scripts.dimension.FgDimNakes

  read_conf:
    dc_nakes:
      <<: *mysql_conf_prod
      table: dc_nakes

    dc_pegawai:
      <<: *mysql_conf_prod
      table: dc_pegawai

    dc_profesi:
      <<: *mysql_conf_prod
      table: dc_profesi_nakes

    dc_spesialisasi:
      <<: *mysql_conf_prod
      table: dc_spesialisasi

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: nama
        type: varchar(100)
      - column_name: profesi
        type: varchar(50)
      - column_name: spesialisasi
        type: varchar(50)
    options:
      batchsize: 1000
      numPartitions: 5

fg_agg_rekap_penggunaan_barang:
  <<: *mysql_conf_mart
  table: fg_agg_rekap_penggunaan_barang
  schema: mart_rsia_abby
  script_type: scala
  script_location: etl_pipeline.scripts.agg.FgAggRekapPenggunaanBarang
  partitionColumn: "id"
  lowerBound: "1"
  upperBound: "10000000"
  numPartitions: 20

  read_conf:
    fg_fact_penjualan_barang:
      <<: *mysql_conf_mart
      table: fg_fact_penjualan_barang
      filter: "partition_date between '{~~~%Y-%m-%d:month=13~~~}' and '{~~~%Y-%m-%d:day=1~~~}'"

    fg_fact_retur_barang:
      <<: *mysql_conf_mart
      table: fg_fact_retur_barang

    fg_dim_pengemasan_barang:
      <<: *mysql_conf_mart
      table: fg_dim_pengemasan_barang

    dc_penjamin:
      <<: *mysql_conf_prod
      table: dc_penjamin

    dc_spesialisasi:
      <<: *mysql_conf_prod
      table: dc_spesialisasi

    fg_dim_nakes:
      <<: *mysql_conf_prod
      table: fg_dim_nakes

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: waktu
        type: timestamp
      - column_name: kategori
        type: varchar(50)  
      - column_name: nama_barang
        type: varchar(1000)
      - column_name: nobatch
        type: varchar(50)
        index: true
      - column_name: nama_dokter
        type: varchar(100)
      - column_name: spesialisasi
        type: varchar(100)
      - column_name: jenis_layanan
        type: varchar(50)
      - column_name: klinik
        type: varchar(50)
      - column_name: cara_bayar
        type: varchar(50)
      - column_name: penjamin
        type: text
      - column_name: jumlah
        type: decimal(16,2)
      - column_name: jumlah_retur
        type: decimal(16,2)
      - column_name: jumlah_pakai
        type: decimal(16,2)
      - column_name: hna
        type: decimal(16,2)
      - column_name: hpp
        type: decimal(16,2)
      - column_name: harga_jual
        type: decimal(16,2)
      - column_name: subtotal_hna
        type: decimal(16,2)
      - column_name: subtotal_hpp
        type: decimal(16,2)
      - column_name: subtotal_harga_jual
        type: decimal(16,2)
      - column_name: tahun
        type: smallint
      - column_name: triwulan
        type: varchar(5)
      - column_name: nama_bulan
        type: varchar(20)
        index: true
      - column_name: partition_date
        type: date
        index: true

    composite_indices:
      - name: "idx_covering_semua"
        columns: [
          "tahun",
          "triwulan",
          "nama_bulan",
          "jenis_layanan",
          "cara_bayar",
          "penjamin",
          "kategori",
          "klinik",
          "partition_date",
          "nama_barang(100)",
          "jumlah",
          "jumlah_retur",
          "jumlah_pakai",
          "subtotal_hna",
          "subtotal_hpp",
          "subtotal_harga_jual"
        ]

    options:
      batchsize: 1000
      numPartitions: 20

fg_fact_pergerakan_stok:
  <<: *mysql_conf_mart
  table: fg_fact_pergerakan_stok
  schema: mart_rsia_abby
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactPergerakanStok

  read_conf:

    dc_stok:
      <<: *mysql_conf_prod
      table: dc_stok
      filter: "date(waktu) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_penerimaan:
      <<: *mysql_conf_prod
      table: dc_penerimaan
      filter: "date(waktu) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_supplier:
      <<: *mysql_conf_prod
      table: dc_supplier

    fg_dim_pengemasan_barang:
      <<: *mysql_conf_mart
      table: fg_dim_pengemasan_barang

  write_conf:
    mode: overwrite

    schema:

      - column_name: id
        type: bigint
        constraint: primary_key,not_null

      - column_name: id_barang
        type: bigint
        index: true

      - column_name: nama_barang
        type: varchar(255)

      - column_name: nobatch
        type: varchar(100)
        index: true

      - column_name: transaksi
        type: varchar(100)

      - column_name: nama_supplier
        type: varchar(255)

      - column_name: waktu
        type: timestamp

      - column_name: masuk
        type: decimal(16,2)

      - column_name: keluar
        type: decimal(16,2)

      - column_name: stok_sesudah
        type: decimal(16,2)

      - column_name: ed
        type: date

      - column_name: total_masuk_kumulatif
        type: decimal(16,2)

      - column_name: total_kurang_kumulatif
        type: decimal(16,2)

      - column_name: sisa_stok_saat_ini
        type: decimal(16,2)

      - column_name: total_nilai_stok_bergerak
        type: decimal(18,2)

      - column_name: tahun
        type: int
        index: true

      - column_name: triwulan
        type: varchar(5)
        index: true

      - column_name: nama_bulan
        type: varchar(20)
        index: true

      - column_name: partition_date
        type: date
        index: true

    options:
      batchsize: 1000
      numPartitions: 5

fg_fact_pergerakan_stok_bulanan:
  <<: *mysql_conf_mart
  table: fg_fact_pergerakan_stok_bulanan
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.agg.FgFactPergerakanStokBulanan

  partitionColumn: "id_barang"
  lowerBound: "1"
  upperBound: "100000"
  numPartitions: 10

  read_conf:
    fg_fact_pergerakan_stok:
      <<: *mysql_conf_mart
      table: fg_fact_pergerakan_stok
      filter: "partition_date <= '{~~~%Y-%m-%d:day=0~~~}'"

  write_conf:
    mode: overwrite

    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null

      - column_name: id_barang
        type: bigint
        constraint: not_null
        index: true

      - column_name: nama_barang
        type: varchar(255)

      - column_name: jumlah_stok_terakhir
        type: decimal(16,2)

      - column_name: nilai_stok_terakhir
        type: decimal(18,2)

      - column_name: waktu
        type: timestamp

      - column_name: tahun
        type: int
        index: true

      - column_name: nama_bulan
        type: varchar(20)
        index: true

      - column_name: partition_date
        type: date
        index: true

    options:
      batchsize: 5000
      numPartitions: 10