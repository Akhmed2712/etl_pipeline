_mysql_conf_base: &mysql_conf_base
  layer: mysql
  env: prod
  credentials_key: mysqlprod    # matches key in credentials/credentials.yml

_mysql_conf_prod: &mysql_conf_prod
  <<: *mysql_conf_base
  database: simrs_rsia_abby

_mysql_conf_mart: &mysql_conf_mart
  <<: *mysql_conf_base
  database: mart_rsia_abby

fg_fact_penjualan_barang:
  <<: *mysql_conf_mart
  table: fg_fact_penjualan_barang
  schema: mart_rsia_abby
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactPenjualanBarang
  partitionColumn: "id"
  lowerBound: "1"
  upperBound: "10000000"
  numPartitions: 20

  read_conf:
    dc_penjualan:
      <<: *mysql_conf_prod
      table: dc_penjualan
      filter: "substring(waktu, 1, 10) = '{~~~%Y-%m-%d:day=0~~~}'"

    dc_detail_penjualan:
      <<: *mysql_conf_prod
      table: dc_detail_penjualan
      filter: "substring(waktu, 1, 10) = '{~~~%Y-%m-%d:day=0~~~}'"

    dc_resep:
      <<: *mysql_conf_prod
      table: dc_resep
      filter: "substring(waktu, 1, 10) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_resep_bebas:
      <<: *mysql_conf_prod
      table: dc_resep_bebas
      filter: "substring(waktu, 1, 10) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_layanan_pendaftaran:
      <<: *mysql_conf_prod
      table: dc_layanan_pendaftaran
      filter: "date(waktu) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_pendaftaran:
      <<: *mysql_conf_prod
      table: dc_pendaftaran
      filter: "date(waktu_daftar) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_penjamin:
      <<: *mysql_conf_prod
      table: dc_penjamin

    fg_dim_pengemasan_barang:
      <<: *mysql_conf_mart
      table: fg_dim_pengemasan_barang

    dc_stok:
      <<: *mysql_conf_prod
      table: dc_stok
      filter: "date(waktu) <= '{~~~%Y-%m-%d:day=0~~~}'"

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: waktu
        type: timestamp 
      - column_name: id_layanan_pendaftaran
        type: bigint 
      - column_name: id_pasien
        type: bigint 
      - column_name: id_dokter
        type: bigint
      - column_name: id_penjualan
        type: bigint
      - column_name: jenis_layanan
        type: varchar(50) 
      - column_name: id_unit_layanan
        type: int
      - column_name: cara_bayar
        type: varchar(50)
      - column_name: id_penjamin
        type: bigint
      - column_name: id_kemasan
        type: bigint
      - column_name: id_barang_paket
        type: bigint
      - column_name: id_resep
        type: bigint
      - column_name: id_resep_bebas
        type: bigint
      - column_name: nobatch
        type: varchar(50)
      - column_name: id_unit
        type: varchar(50)
      - column_name: jumlah
        type: decimal(16,2)
      - column_name: hna
        type: decimal(16,2)
      - column_name: hpp
        type: decimal(16,2)
      - column_name: harga_jual
        type: decimal(16,2)
      - column_name: partition_date
        type: date
        index: true  
    options:
      batchsize: 1000
      numPartitions: 5

fg_fact_retur_barang:
  <<: *mysql_conf_mart
  table: fg_fact_retur_barang
  schema: mart_rsia_abby
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactReturBarang

  read_conf:
    dc_retur_penjualan:
      <<: *mysql_conf_prod
      table: dc_retur_penjualan
      filter: "substring(waktu, 1, 10) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_detur_penjualan:
      <<: *mysql_conf_prod
      table: dc_detur_penjualan
      filter: "substring(waktu, 1, 10) <= '{~~~%Y-%m-%d:day=0~~~}'"

    dc_layanan_pendaftaran:
      <<: *mysql_conf_prod
      table: dc_layanan_pendaftaran
      filter: "substring(waktu, 1,10) <= '{~~~%Y-%m-%d:day=0~~~}'"

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: waktu
        type: timestamp
        index: true  
      - column_name: id_layanan_pendaftaran
        type: bigint
        index: true  
      - column_name: id_kemasan
        type: bigint
        index: true  
      - column_name: jumlah
        type: decimal(10,2)
      - column_name: partition_date
        type: date
        index: true  
    options:
      batchsize: 1000
      numPartitions: 5

fg_dim_pengemasan_barang:
  <<: *mysql_conf_mart
  write_database: mart_rsia_abby
  table: fg_dim_pengemasan_barang
  schema: mart_rsia_abby
  script_type: scala
  script_location: etl_pipeline.scripts.dimension.FgDimPengemasanBarang

  read_conf:
    dc_barang:
      <<: *mysql_conf_prod
      table: dc_barang

    dc_kemasan_barang:
      <<: *mysql_conf_prod
      table: dc_kemasan_barang

    dc_sediaan:
      <<: *mysql_conf_prod
      table: dc_sediaan

    dc_golongan:
      <<: *mysql_conf_prod
      table: dc_golongan

    dc_kategori_barang:
      <<: *mysql_conf_prod
      table: dc_kategori_barang

    dc_barang_paket:
      <<: *mysql_conf_prod
      table: dc_barang_paket

    dc_satuan:
      <<: *mysql_conf_prod
      table: dc_satuan

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: id_barang_paket
        type: bigint
      - column_name: id_barang
        type: bigint
      - column_name: nama_barang
        type: varchar(500)
      - column_name: sediaan
        type: varchar(50)
      - column_name: adm_r
        type: varchar(50)
      - column_name: golongan
        type: varchar(50)
