_mysql_conf_base: &mysql_conf_base
  layer: mysql
  env: prod
  credentials_key: mysqlprod    # matches key in credentials/credentials.yml

_mysql_conf_prod: &mysql_conf_prod
  <<: *mysql_conf_base
  database: simrs_ums

_mysql_conf_mart: &mysql_conf_mart
  <<: *mysql_conf_base
  database: simrs_ums_mart

_postgres_conf_prod: &postgres_conf_prod
  layer: postgres
  env: prod
  credentials_key: postgresprod    # matches key in credentials/credentials.yml
  database: e_doc_ums

fg_fact_mutu_identifikasi_pasien:
  <<: *mysql_conf_mart
  table: fg_fact_mutu_identifikasi_pasien
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactMutuIdentifikasiPasien

  read_conf:
    document_history_list:
      <<: *postgres_conf_prod
      table: public.document_history_list
      filter: > 
        (substring(created_time,1,10) >= '{~~~%Y-%m-01:month=1~~~}' and substring(created_time,1,10) < '{~~~%Y-%m-%d:day=0~~~}') 
        and document_code = 'RM102'

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        index: true
      - column_name: no_rm
        type: varchar(20)
      - column_name: pasien
        type: varchar(255)
      - column_name: verifikasi
        type: varchar(255)
      - column_name: nama_verifikator
        type: varchar(255)
      - column_name: identifikasi_nama
        type: varchar(10)
      - column_name: identifikasi_tanggal_lahir
        type: varchar(10)
      - column_name: status
        type: varchar(50)
      - column_name: tahun
        type: int
        index: true
      - column_name: triwulan
        type: varchar(3)
        index: true
      - column_name: nama_bulan
        type: varchar(20)
        index: true
      - column_name: partition_date
        type: date
        index: true

fg_fact_mutu_scp:
  <<: *mysql_conf_mart
  table: fg_fact_mutu_scp
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactMutuScp

  read_conf:
    document_history_list:
      <<: *postgres_conf_prod
      table: public.document_history_list
      filter: >
        (substring(created_time,1,10) >= '{~~~%Y-%m-01:month=1~~~}' and substring(created_time,1,10) < '{~~~%Y-%m-%d:day=0~~~}') 
        and title IN (
          'Laporan Operasi',
          'Serah Terima Pasien Pre Operasi'
        )

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
      - column_name: no_rm
        type: varchar(50)
      - column_name: nama_pasien
        type: varchar(255)
      - column_name: dokter_bedah
        type: varchar(255)
      - column_name: icd_x
        type: varchar(20)
      - column_name: diagnosa
        type: text
      - column_name: tanggal_operasi
        type: date
      - column_name: jam_asesmen
        type: varchar(10)
      - column_name: jam_operasi
        type: varchar(10)
      - column_name: selisih_menit
        type: bigint
      - column_name: status
        type: varchar(50)
      - column_name: tahun
        type: int
        index: true
      - column_name: triwulan
        type: varchar(5)
        index: true
      - column_name: nama_bulan
        type: varchar(20)
        index: true
      - column_name: partition_date
        type: date
        index: true

fg_fact_mutu_rawat_jalan:
  <<: *mysql_conf_mart
  table: fg_fact_mutu_rawat_jalan
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactMutuRawatJalan

  read_conf:
    dc_pendaftaran:
      <<: *mysql_conf_prod
      table: dc_pendaftaran
      filter: >
        substring(waktu_daftar,1,10) >= '{~~~%Y-%m-01:day=45~~~}' and substring(waktu_daftar,1,10) < '{~~~%Y-%m-%d:day=0~~~}' 
        and lower(rawat) = 'jalan' 
        and status not in ('Batal','Booking')
    dc_layanan_pendaftaran:
      <<: *mysql_conf_prod
      table: dc_layanan_pendaftaran
      filter: >
        substring(waktu,1,10) >= '{~~~%Y-%m-01:day=45~~~}' and substring(waktu,1,10) < '{~~~%Y-%m-%d:day=0~~~}'
        and status not in ('Batal','Belum')
    dc_spesialisasi:
      <<: *mysql_conf_prod
      table: dc_spesialisasi
    dc_taskid_bpjs:
      <<: *mysql_conf_prod
      table: dc_taskid_bpjs
      filter: substring(waktu_rs,1,10) >= '{~~~%Y-%m-01:day=45~~~}' and substring(waktu_rs,1,10) < '{~~~%Y-%m-%d:day=0~~~}'
    dc_nakes:
      <<: *mysql_conf_prod
      table: dc_nakes
    dc_pegawai:
      <<: *mysql_conf_prod
      table: dc_pegawai

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
      - column_name: no_register
        type: varchar(30)
      - column_name: no_rm
        type: varchar(10)
      - column_name: nama_dokter
        type: varchar(255)
      - column_name: spesialisasi
        type: varchar(255)
      - column_name: waktu_task_3
        type: timestamp
      - column_name: waktu_task_4
        type: timestamp
      - column_name: selisih_menit
        type: bigint
      - column_name: status
        type: varchar(100)
      - column_name: tahun
        type: int
        index: true
      - column_name: triwulan
        type: varchar(5)
        index: true
      - column_name: nama_bulan
        type: varchar(20)
        index: true
      - column_name: partition_date
        type: date
        index: true
    options:
      batchsize: 1000
      numPartitions: 20

