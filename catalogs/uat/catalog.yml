fg_fact_mutu_rawat_jalan:
  <<: *mysql_conf_uat_ii
  table: fg_fact_mutu_rawat_jalan
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactMutuRawatJalan

  read_conf:

    dc_pendaftaran:
      database: simrs_ums
      table: dc_pendaftaran
      filter: "substring(waktu_daftar,1,10) >= '{~~~%Y-%m-01:day=45~~~}' and substring(waktu_daftar,1,10) < '{~~~%Y-%m-%d:day=1~~~}' and lower(rawat) = 'jalan' and status not in ('Batal','Booking')"

    dc_layanan_pendaftaran:
      database: simrs_ums
      table: dc_layanan_pendaftaran
      filter: "substring(waktu,1,10) < '{~~~%Y-%m-01:day=0~~~}' and status not in ('Batal','Belum')"

    dc_spesialisasi:
      database: simrs_ums
      table: dc_spesialisasi

    dc_taskid_bpjs:
      database: simrs_ums
      table: dc_taskid_bpjs
      filter: "substring(waktu_rs,1,10) < '{~~~%Y-%m-01:day=0~~~}' and task_id in (3,4)"

