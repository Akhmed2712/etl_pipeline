_mysql_conf_uat: &mysql_conf_uat
  layer: mysql
  env: dev
  credentials_key: mysqldev    # matches key in credentials/credentials.yml
  database: simrs_astrini_bai

_mysql_conf_local: &mysql_conf_local
  layer: mysql
  env: dev
  credentials_key: mysqllocal    # matches key in credentials/credentials.yml
  database: farmagitechs     # used to build jdbc_url: jdbc:mysql://host:port/<database>

mysql_conf_uat_ii: &mysql_conf_uat_ii
  layer: mysql
  env: dev
  credentials_key: mysqldev_2    # matches key in credentials/credentials.yml
  database: simrs_ums 

postgres_conf_uat: &postgres_conf_uat
  layer: postgres
  env: dev
  credentials_key: postgresuat    # matches key in credentials/credentials.yml
  database: e_doc_ums 

fg_dim_pengemasan_barang:
  <<: *mysql_conf_uat_ii
  table: fg_dim_pengemasan_barang
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.dimension.FgDimPengemasanBarang

  read_conf:
    dc_barang:
      database: simrs_ums
      table: dc_barang

    dc_kemasan_barang:
      database: simrs_ums
      table: dc_kemasan_barang

    dc_sediaan:
      database: simrs_ums
      table: dc_sediaan

    dc_golongan:
      database: simrs_ums
      table: dc_golongan

    dc_kategori_barang:
      database: simrs_ums
      table: dc_kategori_barang

    dc_barang_paket:
      database: simrs_ums
      table: dc_barang_paket

    dc_satuan:
      database: simrs_ums
      table: dc_satuan

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: id_barang_paket
        type: bigint
      - column_name: id_barang
        type: bigint
      - column_name: nama_barang
        type: varchar(500)
      - column_name: sediaan
        type: varchar(50)
      - column_name: adm_r
        type: varchar(50)
      - column_name: golongan
        type: varchar(50)
      - column_name: formularium
        type: varchar(5)
      - column_name: fornas
        type: varchar(5)
      - column_name: kategori
        type: varchar(50)
      - column_name: jenis_kategori
        type: varchar(50)
      - column_name: satuan
        type: varchar(50)
      - column_name: hna
        type: decimal(10,2)
      - column_name: hpp
        type: decimal(10,2)
      - column_name: harga_jual
        type: decimal(10,2)
      - column_name: margin_non_resep
        type: decimal(10,2)
      - column_name: margin_resep
        type: decimal(10,2)
      - column_name: margin_resep_rajal
        type: decimal(10,2)
      - column_name: plus_ppn
        type: decimal(10,2)
    options:
      batchsize: 1000
      numPartitions: 5

