fg_fact_penjualan_barang:
  <<: *mysql_conf_uat_ii
  table: fg_fact_penjualan_barang
  schema: simrs_ums_mart
  script_type: scala
  script_location: etl_pipeline.scripts.fact.FgFactPenjualanBarang
  partitionColumn: "id"
  lowerBound: "1"
  upperBound: "3100000"
  numPartitions: 40

  read_conf:
    dc_penjualan:
      database: simrs_ums
      table: dc_penjualan
      filter: "substring(waktu, 1, 10) < '{~~~%Y-%m-%d:day=1~~~}'"

    dc_detail_penjualan:
      database: simrs_ums
      table: dc_detail_penjualan
      filter: "substring(waktu, 1, 10) < '{~~~%Y-%m-%d:day=1~~~}'"

    dc_resep:
      database: simrs_ums
      table: dc_resep
      filter: "substring(waktu, 1, 10) < '{~~~%Y-%m-%d:day=1~~~}'"

    dc_resep_bebas:
      database: simrs_ums
      table: dc_resep_bebas
      filter: "substring(waktu, 1, 10) < '{~~~%Y-%m-%d:day=1~~~}'"

    dc_layanan_pendaftaran:
      database: simrs_ums
      table: dc_layanan_pendaftaran
      filter: "substring(waktu, 1,10) < '{~~~%Y-%m-%d:day=0~~~}'"

    dc_pendaftaran:
      database: simrs_ums
      table: dc_pendaftaran
      filter: "substring(waktu_daftar, 1, 10) < '{~~~%Y-%m-%d:day=0~~~}'"

    dc_penjamin:
      database: simrs_ums
      table: dc_penjamin

    fg_dim_pengemasan_barang:
      database: simrs_ums_mart
      table: fg_dim_pengemasan_barang

    dc_stok:
      database: simrs_ums
      table: dc_stok
      filter: "substring(waktu, 1,10) < '{~~~%Y-%m-%d:day=0~~~}'"

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: waktu
        type: timestamp 
      - column_name: id_layanan_pendaftaran
        type: bigint 
      - column_name: id_pasien
        type: bigint 
      - column_name: id_dokter
        type: bigint
      - column_name: id_penjualan
        type: bigint
      - column_name: jenis_layanan
        type: varchar(50) 
      - column_name: id_unit_layanan
        type: int
      - column_name: cara_bayar
        type: varchar(50)
      - column_name: id_penjamin
        type: bigint
      - column_name: id_kemasan
        type: bigint
      - column_name: id_barang_paket
        type: bigint
      - column_name: id_resep
        type: bigint
      - column_name: id_resep_bebas
        type: bigint
      - column_name: nobatch
        type: varchar(50)
      - column_name: id_unit
        type: varchar(50)
      - column_name: jumlah
        type: decimal(10,2)
      - column_name: hna
        type: decimal(10,2)
      - column_name: hpp
        type: decimal(10,2)
      - column_name: harga_jual
        type: decimal(10,2)
      - column_name: partition_date
        type: date
        index: true  
    options:
      batchsize: 1000
      numPartitions: 5

