fg_fact_rekap_penggunaan_barang:
  <<: *mysql_conf_uat
  table: fg_fact_rekap_penggunaan_barang
  schema: simrs_dw_stga
  script_type: scala
  script_location: etl_pipeline.scripts.fg_fact_rekap_penggunaan_barang.FgFactRekapPenggunaanBarang
  partitionColumn: "id"
  lowerBound: "1"
  upperBound: "10000000"
  numPartitions: 50

  read_conf:
    fg_fact_penjualan_barang:
      database: simrs_dw_stga
      table: fg_fact_penjualan_barang
      filter: "partition_date = '{~~~%Y-%m-%d:day=0~~~}'"

    fg_fact_retur_barang:
      database: simrs_dw_stga
      table: fg_fact_retur_barang

    fg_dim_pengemasan_barang:
      database: simrs_dw_stga
      table: fg_dim_pengemasan_barang

    dc_penjamin:
      database: simrs_astrini_bai
      table: dc_penjamin

    dc_spesialisasi:
      database: simrs_astrini_bai
      table: dc_spesialisasi

    fg_dim_waktu:
      database: simrs_dw_stga
      table: fg_dim_waktu

    fg_dim_nakes:
      database: simrs_dw_stga
      table: fg_dim_nakes

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: waktu
        type: timestamp
      - column_name: kategori
        type: varchar(50)  
      - column_name: nama_barang
        type: varchar(1000)
      - column_name: nobatch
        type: varchar(50)
        index: true
      - column_name: nama_dokter
        type: varchar(100)
      - column_name: spesialisasi
        type: varchar(100)
      - column_name: jenis_layanan
        type: varchar(50)
      - column_name: klinik
        type: varchar(50)
      - column_name: cara_bayar
        type: varchar(50)
      - column_name: penjamin
        type: varchar(50)
      - column_name: jumlah
        type: decimal(10,2)
      - column_name: jumlah_retur
        type: decimal(10,2)
      - column_name: jumlah_pakai
        type: decimal(10,2)
      - column_name: hna
        type: decimal(10,2)
      - column_name: hpp
        type: decimal(10,2)
      - column_name: harga_jual
        type: decimal(10,2)
      - column_name: subtotal_hna
        type: decimal(16,2)
      - column_name: subtotal_hpp
        type: decimal(16,2)
      - column_name: subtotal_harga_jual
        type: decimal(16,2)
      - column_name: tahun
        type: smallint
      - column_name: triwulan
        type: varchar(5)
      - column_name: nama_bulan
        type: varchar(20)
        index: true
      - column_name: partition_date
        type: date
        index: true

    composite_indices:
      - name: "idx_covering_semua"
        columns: [
          "tahun",
          "triwulan",
          "nama_bulan",
          "jenis_layanan",
          "cara_bayar",
          "penjamin",
          "kategori",
          "klinik",
          "partition_date",
          "nama_barang(100)",
          "jumlah",
          "jumlah_retur",
          "jumlah_pakai",
          "subtotal_hna",
          "subtotal_hpp",
          "subtotal_harga_jual"
        ]

    options:
      batchsize: 1000
      numPartitions: 20

