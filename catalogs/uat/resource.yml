# ──────────────────────────────────────────────────────────────────
# Base Spark config anchor - Optimized for Jakarta Timezone
# ──────────────────────────────────────────────────────────────────
_base_conf: &base_conf
  spark.sql.session.timeZone: Asia/Jakarta
  spark.driver.extraJavaOptions: "-Duser.timezone=Asia/Jakarta"
  spark.executor.extraJavaOptions: "-Duser.timezone=Asia/Jakarta"
  spark.sql.ansi.enabled: false
  spark.sql.legacy.timeParserPolicy: LEGACY
  # Optimasi Memori Global
  spark.memory.fraction: 0.8
  spark.memory.storageFraction: 0.2
  spark.driver.maxResultSize: 2g

# ──────────────────────────────────────────────────────────────────
# Presets - Tailored for 16GB RAM Hardware
# ──────────────────────────────────────────────────────────────────
low: &low
  <<: *base_conf
  spark.executor.cores: 1
  spark.executor.memory: 1g
  spark.executor.instances: 1

medium: &medium
  <<: *base_conf
  spark.executor.cores: 2
  spark.executor.memory: 2g
  spark.executor.instances: 2

# Substitusi untuk profil "High" yang sebelumnya crash
high_local: &high_local
  <<: *base_conf
  spark.executor.cores: 4
  spark.executor.memory: 4g   # Dinaikkan untuk menangani "Java heap space"
  spark.driver.memory: 2g
  spark.executor.instances: 2  # Dibatasi agar total RAM tidak meledak

# ──────────────────────────────────────────────────────────────────
# Job-specific resource
# ──────────────────────────────────────────────────────────────────
my_orders_job:
  <<: *low
  spark.app.name: my_orders_job
  spark.sql.shuffle.partitions: 10

tes_pendaftaran:
  <<: *low
  spark.app.name: tes_pendaftaran
  spark.sql.shuffle.partitions: 10

fg_dim_pengemasan_barang:
  <<: *low
  spark.app.name: fg_dim_pengemasan_barang
  spark.sql.shuffle.partitions: 10

fg_fact_penjualan_barang:
  <<: *high_local
  spark.app.name: fg_fact_penjualan_barang
  spark.sql.shuffle.partitions: 20
  spark.executor.cores: 2         
  spark.executor.memory: 8g       
  spark.executor.instances: 1      
  spark.sql.shuffle.partitions: 200 
  spark.memory.fraction: 0.7

fg_fact_retur_barang:
  <<: *low
  spark.app.name: fg_fact_retur_barang
  spark.sql.shuffle.partitions: 10

fg_dim_penjamin:
  <<: *low
  spark.app.name: fg_dim_penjamin
  spark.sql.shuffle.partitions: 10

fg_dim_layanan:
  <<: *low
  spark.app.name: fg_dim_layanan
  spark.sql.shuffle.partitions: 10

fg_fact_rekap_penggunaan_barang:
  <<: *base_conf
  spark.app.name: fg_fact_rekap_penggunaan_barang
  spark.executor.cores: 2         # Gunakan maksimal 2 core agar tidak banyak task antri memori
  spark.executor.memory: 4g       # Alokasi heap yang cukup tapi tidak berlebihan
  spark.executor.instances: 1      # WAJIB 1 untuk debugging di lokal
  spark.sql.shuffle.partitions: 200 # JANGAN 4 JUTA. Gunakan 200 untuk data menengah.
  spark.memory.fraction: 0.7
  
fg_dim_waktu:
  <<: *low
  spark.app.name: fg_dim_waktu
  spark.sql.shuffle.partitions: 10