fg_fact_rekap_penggunaan_barang_non_paket:
  <<: *mysql_conf_local_olap
  table: fg_fact_rekap_penggunaan_barang_non_paket
  schema: testing
  script_type: scala
  script_location: etl_pipeline.scripts.fg_fact_rekap_penggunaan_barang_non_paket.FgFactRekapPenggunaanBarangNonPaket

  read_conf:
    fg_fact_penjualan_barang:
      database: testing
      table: fg_fact_penjualan_barang
      filter: "partition_date = '{~~~%Y-%m-%d:day=1~~~}'"

    fg_fact_retur_barang:
      database: testing
      table: fg_fact_retur_barang

    fg_dim_pengemasan_barang:
      database: testing
      table: fg_dim_pengemasan_barang

    fg_dim_penjamin:
      database: testing
      table: fg_dim_penjamin

    fg_dim_layanan:
      database: testing
      table: fg_dim_layanan

  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: bigint
        constraint: primary_key,not_null
      - column_name: waktu
        type: timestamp
        index: true             # Penting untuk filter waktu/tahun
      - column_name: kategori
        type: varchar(50)  
        index: true             # Mempercepat filter Kategori
      - column_name: nama_barang
        type: varchar(1000)
      - column_name: jenis_layanan
        type: varchar(50)
        index: true             # Mempercepat filter Jenis Layanan
      - column_name: klinik
        type: varchar(50)
      - column_name: cara_bayar
        type: varchar(50)
        index: true             # Mempercepat filter Cara Bayar
      - column_name: penjamin
        type: varchar(50)
        index: true             # Mempercepat filter Penjamin (Cascading)
      - column_name: jumlah
        type: decimal(10,2)
      - column_name: jumlah_retur
        type: decimal(10,2)
      - column_name: jumlah_pakai
        type: decimal(10,2)
      - column_name: hpp
        type: decimal(10,2)
      - column_name: harga_jual
        type: decimal(10,2)
      - column_name: subtotal_hpp
        type: decimal(16,2)
      - column_name: subtotal_harga_jual
        type: decimal(16,2)
      - column_name: partition_date
        type: date
        index: true             # Rekomendasi utama untuk filter triwulan/tahun
    options:
      batchsize: 1000
      numPartitions: 20

fg_dim_waktu:
  <<: *mysql_conf_local_olap
  table: fg_dim_waktu
  schema: testing
  script_location: etl_pipeline.scripts.fg_dim_waktu.FgDimWaktu
  read_conf:
    start_year: 2020
    end_year: 2030
  write_conf:
    mode: overwrite
    schema:
      - column_name: id
        type: int
        constraint: primary_key,not_null
      - column_name: tanggal
        type: date
        index: true
      - column_name: hari
        type: tinyint
      - column_name: nama_hari
        type: varchar(20)
      - column_name: minggu_ke
        type: tinyint
      - column_name: bulan
        type: tinyint
      - column_name: nama_bulan
        type: varchar(20)
      - column_name: triwulan
        type: tinyint
        index: true
      - column_name: tahun
        type: smallint
        index: true
      - column_name: is_weekend
        type: boolean